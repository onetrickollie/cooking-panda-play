<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<title>Cooking Panda</title>
		<style>
@font-face { font-family: "Fredoka"; src: url("fonts/Fredoka-Variable.ttf"); font-weight: 300 700; }
@font-face { font-family: "Nunito"; src: url("fonts/Nunito-Variable.ttf"); font-weight: 200 1000; }
/* Cooking Panda loader (MSG-029). The splash image, when set as the project's
   boot splash (ART-23 title art), fills the screen behind the loader. */
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { background-color: #302922; overflow: hidden; touch-action: none; }
#game-frame { position: fixed; inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
/* Phones: no pull-to-refresh, rubber-banding, text selection, callouts or tap
   flashes while playing (MSG-092). The viewport meta keeps zoom off. */
html, body { overscroll-behavior: none; -webkit-user-select: none; user-select: none;
	-webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#canvas { display: block; position: absolute; touch-action: none; }
#canvas:focus { outline: none; }
#status {
	position: absolute; inset: 0;
	background: radial-gradient(ellipse at 50% 42%, #FFE3B0 0%, #F5E6CC 60%);
	display: flex; flex-direction: column; justify-content: center; align-items: center;
	visibility: hidden;
	font-family: "Nunito", ui-rounded, "Trebuchet MS", system-ui, sans-serif; font-weight: 700;
	color: #6B3D24;
}
#status-splash { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#status-splash.show-image--false { display: none; }
#loader { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1.2rem;
	padding: 2rem 3rem; border-radius: 2rem; }
#status-splash.show-image--true ~ #loader { background: rgba(245, 230, 204, 0.85); }
#loader h1 { margin: 0; font-family: "Fredoka", "Nunito", sans-serif; font-weight: 600; font-size: clamp(2.4rem, 7vw, 5.5rem); letter-spacing: 0.02em;
	text-shadow: 0 4px 0 #FFF6E6; }
/* A little wok tossing three bits of food. */
#wok { position: relative; width: 120px; height: 70px; }
#wok .pan { position: absolute; bottom: 0; left: 10px; width: 100px; height: 34px;
	background: #3A3532; border-radius: 0 0 60px 60px; box-shadow: inset 0 6px 0 #5A524D; }
#wok .handle { position: absolute; bottom: 16px; left: -18px; width: 36px; height: 9px;
	background: #B4703C; border-radius: 5px; }
#wok .bit { position: absolute; bottom: 26px; width: 14px; height: 14px; border-radius: 50%;
	animation: toss 1.1s ease-in-out infinite; }
#wok .bit:nth-child(3) { left: 38px; background: #F08A2B; }
#wok .bit:nth-child(4) { left: 56px; background: #FFD15C; animation-delay: 0.15s; }
#wok .bit:nth-child(5) { left: 74px; background: #7CB342; animation-delay: 0.3s; }
@keyframes toss { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(-42px) rotate(180deg); } }
#bar { width: min(60vw, 520px); height: 22px; background: #E8CFA6; border-radius: 11px;
	box-shadow: inset 0 2px 4px rgba(107, 61, 36, 0.25); overflow: hidden; }
#bar-fill { width: 0%; height: 100%; background: linear-gradient(#FFB45A, #E8792B);
	border-radius: 11px; transition: width 0.2s; }
#bar.indeterminate #bar-fill { width: 30%; animation: slide 1.2s ease-in-out infinite; }
@keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
#status-text { font-size: 1.2rem; opacity: 0.8; }
/* Phones held upright: a full-size note over the game (the game pauses too). */
#rotate { display: none; position: fixed; inset: 0; z-index: 5; background: rgba(245, 230, 204, 0.94);
	flex-direction: column; justify-content: center; align-items: center; gap: 1rem; text-align: center;
	font-family: "Fredoka", "Nunito", sans-serif; color: #6B3D24; padding: 2rem; pointer-events: none; }
#rotate .phone { width: 64px; height: 108px; border: 6px solid #6B3D24; border-radius: 14px;
	animation: turn 1.8s ease-in-out infinite; }
#rotate h2 { margin: 0; font-size: 1.8rem; font-weight: 600; }
#rotate p { margin: 0; font-family: "Nunito", sans-serif; font-weight: 700; opacity: 0.8; }
@keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
#status-notice { display: none; background-color: #5b3943; border-radius: 0.5rem; color: #fff;
	margin: 0 2rem; padding: 1rem; text-align: center; line-height: 1.3; }
</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<div id="game-frame"><canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas></div>

		<div id="rotate"><div class="phone"></div><h2>Turn your phone sideways</h2>
			<p>Cooking Panda plays in landscape. The kitchen waits.</p></div>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<div id="loader">
				<h1>Cooking Panda</h1>
				<div id="wok"><div class="handle"></div><div class="pan"></div>
					<div class="bit"></div><div class="bit"></div><div class="bit"></div></div>
				<div id="bar" class="indeterminate"><div id="bar-fill"></div></div>
				<div id="status-text">Heating up the kitchen…</div>
			</div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":15504424,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

// One owner for canvas size. Keep the whole kitchen and input space at 16:9;
// never independently stretch the painting to the browser's aspect ratio.
function fitGameRect(width, height) {
	const scale = Math.min(width / 1920, height / 1080);
	const w = 1920 * scale, h = 1080 * scale;
	return {width:w, height:h, left:(width-w)/2, top:(height-h)/2};
}
const gameFrame = document.getElementById('game-frame');
const gameCanvas = document.getElementById('canvas');
function fitGameCanvas() {
	const bounds = gameFrame.getBoundingClientRect();
	const fit = fitGameRect(bounds.width, bounds.height);
	const dpr = Math.min(window.devicePixelRatio || 1, 2);
	for (const key of ['width', 'height', 'left', 'top']) gameCanvas.style[key] = fit[key] + 'px';
	const w = Math.max(1, Math.round(fit.width * dpr));
	const h = Math.max(1, Math.round(fit.height * dpr));
	if (gameCanvas.width !== w) gameCanvas.width = w;
	if (gameCanvas.height !== h) gameCanvas.height = h;
}
new ResizeObserver(fitGameCanvas).observe(gameFrame);
window.addEventListener('resize', fitGameCanvas);
fitGameCanvas();

(function () {
	const statusOverlay = document.getElementById('status');
	const statusLoader = document.getElementById('loader');
	const statusBar = document.getElementById('bar');
	const statusFill = document.getElementById('bar-fill');
	const statusText = document.getElementById('status-text');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusLoader.style.display = mode === 'progress' ? 'flex' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const pct = Math.min(100, Math.round(current / total * 100));
					statusBar.classList.remove('indeterminate');
					statusFill.style.width = pct + '%';
					statusText.textContent = pct < 100 ? 'Heating up the kitchen… ' + pct + '%' : 'Almost ready…';
				} else {
					statusBar.classList.add('indeterminate');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
